<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debug viewer — pixel-art map</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a2733; }
  #map { width: 100%; height: 100%; }
  #hud { position: fixed; top: 10px; left: 10px; color: #cfe3f5;
         font: 13px sans-serif; background: rgba(20,32,44,.85);
         padding: 8px 12px; border-radius: 6px; }
  #hud button { margin-left: 8px; }
  #sel { position: fixed; border: 2px dashed #ffb84d;
         background: rgba(255,184,77,.15); pointer-events: none; display: none; }
  #panel { position: fixed; top: 10px; right: 10px; max-width: 26em;
           color: #cfe3f5; font: 13px sans-serif; background: rgba(20,32,44,.92);
           padding: 10px 14px; border-radius: 6px; display: none; }
  #panel a { color: #8fd0ff; }
  #panel code { display: block; background: #0f1922; padding: 6px;
                border-radius: 4px; margin-top: 6px; white-space: pre-wrap;
                word-break: break-all; user-select: all; }
</style>
<div id="map"></div>
<div id="hud"><span id="city-label"></span> — drag to pan, scroll to zoom
  <button id="repair-btn">✂ Select repair region</button></div>
<div id="sel"></div>
<div id="panel"></div>
<script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/openseadragon.min.js"></script>
<script>
  const city = new URLSearchParams(location.search).get("city") || "toronto";
  document.getElementById("city-label").textContent = "Debug viewer — " + city;
  document.title = "Debug viewer — " + city;

  const viewer = OpenSeadragon({
    id: "map",
    tileSources: `/docs/${city}/map.dzi`,
    prefixUrl: "https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/images/",
    showNavigator: true,
    navigatorPosition: "BOTTOM_RIGHT",
    minZoomImageRatio: 0.6,
    maxZoomPixelRatio: 4,
    visibilityRatio: 0.7,
  });
  viewer.addHandler("open", async () => {
    try {
      const meta = await (await fetch(`/docs/${city}/map_meta.json?` + Date.now())).json();
      const r = viewer.viewport.imageToViewportRectangle(
        new OpenSeadragon.Rect(meta.x, meta.y, meta.w, meta.h));
      viewer.viewport.fitBounds(r, true);
      viewer.viewport.applyConstraints(true);
    } catch (e) { console.warn("no map_meta.json", e); }
  });

  // repair region selection: image-pixel coords, sent to /api/repair
  const btn = document.getElementById("repair-btn");
  const sel = document.getElementById("sel");
  const panel = document.getElementById("panel");
  let selecting = false, start = null;

  btn.onclick = () => {
    selecting = !selecting;
    btn.textContent = selecting ? "cancel selection" : "✂ Select repair region";
    viewer.setMouseNavEnabled(!selecting);
    sel.style.display = "none";
    if (!selecting) start = null;
  };

  function imgPoint(ev) {
    const wp = viewer.viewport.pointFromPixel(
      new OpenSeadragon.Point(ev.clientX, ev.clientY));
    return viewer.viewport.viewportToImageCoordinates(wp);
  }

  const el = viewer.canvas;
  el.addEventListener("pointerdown", ev => {
    if (!selecting) return;
    start = { x: ev.clientX, y: ev.clientY, img: imgPoint(ev) };
    sel.style.display = "block";
  }, true);
  el.addEventListener("pointermove", ev => {
    if (!selecting || !start) return;
    const x = Math.min(start.x, ev.clientX), y = Math.min(start.y, ev.clientY);
    sel.style.left = x + "px"; sel.style.top = y + "px";
    sel.style.width = Math.abs(ev.clientX - start.x) + "px";
    sel.style.height = Math.abs(ev.clientY - start.y) + "px";
  }, true);
  el.addEventListener("pointerup", async ev => {
    if (!selecting || !start) return;
    const a = start.img, b = imgPoint(ev);
    const x0 = Math.round(Math.min(a.x, b.x)), x1 = Math.round(Math.max(a.x, b.x));
    const y0 = Math.round(Math.min(a.y, b.y)), y1 = Math.round(Math.max(a.y, b.y));
    btn.onclick();  // leave selection mode
    if (x1 - x0 < 8 || y1 - y0 < 8) return;
    panel.style.display = "block";
    panel.innerHTML = "exporting repair region…";
    try {
      const r = await fetch(`/api/repair?city=${city}&x0=${x0}&y0=${y0}&x1=${x1}&y1=${y1}`);
      const j = await r.json();
      if (j.error) { panel.innerHTML = "<b>error:</b> " + j.error; return; }
      panel.innerHTML = `<b>${j.name}</b><br>
        <a href="/${j.canvas}" download>canvas</a> ·
        <a href="/${j.prompt}" target="_blank">prompt</a> ·
        <a href="/${j.render}" target="_blank">render</a> ·
        <a href="/${j.map}" target="_blank">map</a><br>
        Stylize in a FRESH chat, save to style_refs/${j.name}_pixel.png, then:
        <code>${j.commit_cmd}</code>`;
    } catch (e) { panel.innerHTML = "<b>request failed:</b> " + e; }
  }, true);
</script>
