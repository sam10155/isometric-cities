<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isometric Toronto</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a2733; }
  #map { width: 100%; height: 100%; }
  #hud { position: fixed; top: 10px; left: 10px; color: #cfe3f5;
         font: 13px sans-serif; background: rgba(20,32,44,.85);
         padding: 8px 12px; border-radius: 6px; z-index: 10; max-width: 26em; }
  #hud button { margin-top: 6px; }
  #selbox { position: fixed; border: 2px dashed #ffd34d;
            background: rgba(255,211,77,.15); display: none; z-index: 5;
            pointer-events: none; }
  #result a { color: #8fd0ff; }
  #result code { background: rgba(0,0,0,.4); padding: 1px 4px; border-radius: 3px;
                 display: inline-block; margin-top: 4px; user-select: all; }
</style>
<div id="map"></div>
<div id="hud">
  <div>Isometric Toronto — drag to pan, scroll to zoom</div>
  <button id="repairBtn">✂ Select repair region</button>
  <div id="result"></div>
</div>
<div id="selbox"></div>
<script src="https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/openseadragon.min.js"></script>
<script>
  const viewer = OpenSeadragon({
    id: "map",
    tileSources: "/docs/map.dzi",
    prefixUrl: "https://cdn.jsdelivr.net/npm/openseadragon@4.1/build/openseadragon/images/",
    showNavigator: true,
    navigatorPosition: "BOTTOM_RIGHT",
    minZoomImageRatio: 0.6,
    maxZoomPixelRatio: 4,
    visibilityRatio: 0.7,
  });

  const btn = document.getElementById("repairBtn");
  const box = document.getElementById("selbox");
  const result = document.getElementById("result");
  let selecting = false, start = null;

  btn.onclick = () => {
    selecting = !selecting;
    btn.textContent = selecting ? "✂ Drag a rectangle… (click to cancel)"
                                : "✂ Select repair region";
    viewer.setMouseNavEnabled(!selecting);
    if (!selecting) { box.style.display = "none"; start = null; }
  };

  function imgPoint(ev) {
    const rect = viewer.element.getBoundingClientRect();
    const pt = new OpenSeadragon.Point(ev.clientX - rect.left, ev.clientY - rect.top);
    const vp = viewer.viewport.pointFromPixel(pt);
    return viewer.viewport.viewportToImageCoordinates(vp);
  }

  window.addEventListener("pointerdown", ev => {
    if (!selecting || ev.target.closest("#hud")) return;
    start = { x: ev.clientX, y: ev.clientY, img: imgPoint(ev) };
    box.style.display = "block";
  }, true);

  window.addEventListener("pointermove", ev => {
    if (!selecting || !start) return;
    const x0 = Math.min(start.x, ev.clientX), y0 = Math.min(start.y, ev.clientY);
    box.style.left = x0 + "px"; box.style.top = y0 + "px";
    box.style.width = Math.abs(ev.clientX - start.x) + "px";
    box.style.height = Math.abs(ev.clientY - start.y) + "px";
  }, true);

  window.addEventListener("pointerup", async ev => {
    if (!selecting || !start) return;
    const a = start.img, b = imgPoint(ev);
    const x0 = Math.round(Math.min(a.x, b.x)), y0 = Math.round(Math.min(a.y, b.y));
    const x1 = Math.round(Math.max(a.x, b.x)), y1 = Math.round(Math.max(a.y, b.y));
    selecting = false; start = null;
    btn.textContent = "✂ Select repair region";
    box.style.display = "none";
    viewer.setMouseNavEnabled(true);
    if (x1 - x0 < 32 || y1 - y0 < 32) { result.textContent = "selection too small"; return; }
    result.textContent = "exporting…";
    try {
      const r = await fetch(`/api/repair?x0=${x0}&y0=${y0}&x1=${x1}&y1=${y1}`);
      const j = await r.json();
      if (j.error) { result.textContent = "error: " + j.error; return; }
      result.innerHTML =
        `<div>Repair <b>${j.name}</b>:</div>` +
        `<a href="/${j.canvas}" download>⬇ canvas (stylize this)</a> · ` +
        `<a href="/${j.render}" download>⬇ base render</a> · ` +
        `<a href="/${j.map}" download>⬇ current map</a> · ` +
        `<a href="/${j.prompt}" target="_blank">prompt</a>` +
        `<div>after upload: <code>${j.commit_cmd}</code></div>`;
    } catch (e) { result.textContent = "request failed: " + e; }
  }, true);
</script>
