# City configuration: Montreal, Canada
# Founding focal point: Place d'Armes / Old Montreal (Notre-Dame Basilica).

name: montreal
display_name: Montreal, Canada

# MTM zone 8 (NAD83 CSRS) — the zone covering Montreal. Meters.
crs: EPSG:2950

# Seed point (lon, lat WGS84) — Place d'Armes, Old Montreal.
seed_lonlat: [-73.5560, 45.5050]

grid:
  quadrant_px: 512
  meters_per_quadrant: 128.0
  # Same convention as the other cities: ~16 km west / ~8 km north margin,
  # snapped to the 128 m grid; seed lands at quadrant (125, 63).
  origin_xy: [284416.0, 5048704.0]

camera:
  azimuth_deg: 225
  elevation_deg: 30
  projection: orthographic

# Old Montreal + downtown core: Old Port / St. Lawrence shore -> Place Ville
# Marie, Mount Royal foot -> Jacques-Cartier Bridge approach.
pilot_bbox_lonlat: [-73.5900, 45.4900, -73.5300, 45.5250]
