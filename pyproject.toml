[project]
name = "isomap"
version = "0.1.0"
description = "Isometric pixel-art city map generator"
requires-python = ">=3.12"
dependencies = [
    "pillow",
    "pyyaml",
    "pyproj",
    "numpy",
    "trimesh",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["isomap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
